# Set default values
# =============================================================================
# Default load plugins
set -g @load-plugins "true"
# Activate/deactivate plugins
set -g @load-plugins-vim-tmux-navigator "true"
set -g @load-plugins-tmux-open-nvim " true"
set -g @load-plugins-tmux-fzf-url "true"
set -g @load-plugins-tmux-fzf-session "true"
set -g @load-plugins-tmux-fzf-session-switch "false"
set -g @load-plugins-tmux-agent-sidebar "true"
set -g @load-plugins-tmux-fzf-links "true"
set -g @load-plugins-tmux-thumbs "true"
set -g @load-plugins-datstatus "true"
# Load my options
set -g @load-options "true"
# Load my bindings
set -g @load-bindings "true"

# Plugins Configurations
# =============================================================================
# Tmux FZF Links
# -----------------------------------------------------------------------------
set -g @fzf-links-key "p"
set -g @fzf-links-history-lines "10"
set -g @fzf-links-editor-open-cmd "ton +%line '%file'"

# Sesh
# -----------------------------------------------------------------------------
# Geometry
set -g @sidebar_width    "15%"
set -g @sidebar_position "right"
set -g @sidebar_bottom_height 0

# Auto-create the sidebar on new windows (set off to disable)
set -g @sidebar_auto_create on
# Seconds to defer auto-create after a window opens, so a declaratively-built window (e.g. tmuxinator’s select-layout) finishes before the sidebar pane is injected; accepts fractional seconds. 0 keeps the create synchronous
set -g @sidebar_auto_create_delay 1
# Master switch for desktop notifications
set -g @sidebar_notifications off
# Restrict events — see Notifications
# @sidebar_notifications_events unset
# Show the animated pet in a 5-row band above the bottom panel
set -g @sidebar_pet off

# Color palette matching datstatus muted-blue/grey segments
set -g @sidebar_color_border          240
set -g @sidebar_color_selection       237
set -g @sidebar_color_accent          153
set -g @sidebar_color_session         39
set -g @sidebar_color_text_active     255
set -g @sidebar_color_text_muted      252
set -g @sidebar_color_text_inactive   244
set -g @sidebar_color_running         114
set -g @sidebar_color_waiting         221
set -g @sidebar_color_idle            110
set -g @sidebar_color_error           167

# Status icons
# Any Unicode glyph works. Make sure the glyphs render in your terminal font.
# Status filter bar “all” icon
set -g @sidebar_icon_all " "
# Running status icon
set -g @sidebar_icon_running " "
# Background shell status icon
set -g @sidebar_icon_background " "
# Waiting status icon
set -g @sidebar_icon_waiting " "
# Idle status icon
set -g @sidebar_icon_idle " "
# Error status icon
set -g @sidebar_icon_error " "
# Unknown status icon
set -g @sidebar_icon_unknown " "

# Configurations Files Loading
# =============================================================================
# Load Default Colors Configurations
source ~/.config/tmux/config/colors.conf

# Load user additional custom configuration
if "test -f ~/.local/share/tmux/tmux.conf" {
  source "~/.local/share/tmux/tmux.conf"
}

# Load default options, useless if your custom.conf override all
if "[[ \$(tmux show -gv @load-default) != 'false' ]]" {
  # Default Configurations
  source ~/.config/tmux/config/ui.conf
}

if "[[ \$(tmux show -gv @load-options) == 'true' ]]" {
  # General Options
  source ~/.config/tmux/config/options.conf
}

if "[[ \$(tmux show -gv @load-plugins) == 'true' ]]" {
  # Plugins Declaration
  source ~/.config/tmux/config/plugins.conf
}

if "[[ \$(tmux show -gv @load-bindings) == 'true' ]]" {
  # Key Bindings
  source ~/.config/tmux/config/bindings.conf
}

# vim: ft=tmux
